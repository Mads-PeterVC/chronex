[project]
name = "chronex"
version = "0.0.1"
description = "Provenance records for computational research: what each step read, wrote and ran"
readme = "README.md"
authors = [
    { name = "Mads-Peter Verner Christiansen", email = "mpvc@bio.aau.dk" }
]
requires-python = ">=3.11"
dependencies = [
    "rich-click>=1.9.9",
]

[project.optional-dependencies]
shephex = ["shephex"]

[project.scripts]
chronex = "chronex.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]
# The toy workflow in examples/ and its tests: `uv sync --group examples`. The mixed variant also
# needs an unreleased shephex change: `uv pip install -e ../shephex` from a checkout.
examples = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "shephex",
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "pyyaml>=6.0.3",
]
docs = [
    "zensical>=0.0.73",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]  # en dashes and multiplication signs in messages are meant

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chronex"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
